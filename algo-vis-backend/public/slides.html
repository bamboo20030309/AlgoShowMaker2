<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlgoShowMaker Slides</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/vendor/reveal/reset.css" />
  <link rel="stylesheet" href="/vendor/reveal/reveal.css" />
  <link rel="stylesheet" href="/vendor/reveal/theme/white.css" />
  <link rel="stylesheet" href="/vendor/reveal/plugin/highlight/monokai.css" />
  <link rel="stylesheet" href="slides.css?v=random-id-90" />
</head>

<body class="asm-edit-mode">
  <a class="chrome-home-link" href="/" title="返回我的投影片" aria-label="返回我的投影片">
    <svg class="chrome-home-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 10.8 12 3l9 7.8"></path>
      <path d="M5.5 9.5V21h13V9.5M9.5 21v-7h5v7"></path>
    </svg>
  </a>
  <aside id="controlChrome" class="control-chrome" aria-label="控制欄">
    <div class="mode-switch" aria-label="模式切換">
      <button id="modeToggleBtn" type="button" title="切換至 Present 模式" aria-label="切換至 Present 模式">
        <svg class="mode-toggle-icon mode-icon-edit" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 4h16v15H4z" />
          <path d="M7 16l1.1-3.6 7.4-7.4 2.5 2.5-7.4 7.4zM14.2 6.3l2.5 2.5" />
        </svg>
        <svg class="mode-toggle-icon mode-icon-present" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 3h16v10H4zM8 7h8" />
          <path d="M9 16h6l1 5H8zM12 13v3" />
        </svg>
      </button>
    </div>
    <div class="deck-io-controls" aria-label="Slide controls">
      <button id="ttsPanelToggleBtn" class="deck-io-btn tts-control-toggle" type="button" title="開啟或關閉 TTS" aria-label="開啟或關閉 TTS" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h10v2H4zm0 5h10v2H4zm0 5h7v2H4zm13-5.4v4.8l4 2.3V7.3z"></path></svg>
      </button>
      <button id="exportDeckBtn" class="deck-io-btn deck-export-btn" type="button" title="下載投影片 JSON" aria-label="下載投影片 JSON">
        <svg class="deck-io-icon deck-export-icon" viewBox="0 0 32 32" aria-hidden="true">
          <path class="deck-io-body" d="M6 11h12l4 5v11H6z" />
          <circle class="deck-io-body" cx="14" cy="20" r="2.3" />
          <g class="deck-io-arrow-group">
            <path class="deck-io-arrow" d="M20 12c0-4.4 2.8-7 7-7" />
            <path class="deck-io-arrow" d="M24 2.8l3.3 2.2-2.2 3.3" />
          </g>
        </svg>
      </button>
      <button id="importDeckBtn" class="deck-io-btn deck-import-btn" type="button" title="匯入投影片 JSON" aria-label="匯入投影片 JSON">
        <svg class="deck-io-icon deck-import-icon" viewBox="0 0 32 32" aria-hidden="true">
          <path class="deck-io-body" d="M6 11h12l4 5v11H6z" />
          <circle class="deck-io-body" cx="14" cy="20" r="2.3" />
          <g class="deck-io-arrow-group">
            <path class="deck-io-arrow" d="M29 4.5c-4.4 0-7 2.8-7 7" />
            <path class="deck-io-arrow" d="M19.8 9.8l2.2 2.2 2.2-2.2" />
          </g>
        </svg>
      </button>
      <button id="shareDeckBtn" class="deck-io-btn" type="button" title="分享投影片" aria-label="分享投影片" hidden>
        <svg class="share-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="18" cy="5" r="2.5"></circle>
          <circle cx="6" cy="12" r="2.5"></circle>
          <circle cx="18" cy="19" r="2.5"></circle>
          <path d="M8.2 10.8l7.6-4.5M8.2 13.2l7.6 4.5"></path>
        </svg>
      </button>
      <input id="importDeckInput" type="file" accept="application/json,.json" hidden />
    </div>
    <div class="slide-zoom-controls" role="toolbar" aria-label="Slide zoom">
      <button id="slideZoomOutBtn" type="button" title="Zoom out" aria-label="Zoom out">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path></svg>
      </button>
      <output id="slideZoomValue" aria-live="polite">100%</output>
      <button id="slideZoomInBtn" type="button" title="Zoom in" aria-label="Zoom in">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
      <button id="slideZoomResetBtn" type="button" title="Reset zoom" aria-label="Reset zoom">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8V5h3M19 8V5h-3M5 16v3h3M19 16v3h-3"></path></svg>
      </button>
    </div>
  </aside>

  <div id="sharedAccessBadge" class="shared-access-badge" hidden></div>

  <aside id="editorChrome" class="editor-chrome" aria-label="投影片元件">
    <div class="deck-cloud-meta">
      <div id="cloudSaveStatus" class="cloud-save-status" role="status" aria-live="polite">
        <span class="cloud-status-dot"></span>
        <span class="cloud-status-text">本機草稿</span>
      </div>
    </div>
    <div id="defaultToolPanel" class="sidebar-panel">
    <button type="button" class="palette-item tool-text" draggable="true" data-tool="text" title="text">
      <span class="tool-icon">T</span>
      <span>text</span>
    </button>

    <button type="button" class="palette-item tool-latex" draggable="true" data-tool="latex" title="LaTeX 公式">
      <span class="tool-icon">Σ</span>
      <span>LaTeX</span>
    </button>

    <button type="button" class="palette-item tool-code" draggable="true" data-tool="code" title="C++ 程式碼">
      <span class="tool-icon">{}</span>
      <span>code</span>
    </button>

    <div class="shape-tool">
      <button id="shapeMenuBtn" type="button" class="palette-item tool-shape" title="Shapes">
        <span class="shape-stack" aria-hidden="true">
          <span class="shape-circle"></span>
          <span class="shape-triangle"></span>
        </span>
        <span>shapes</span>
      </button>
      <div id="shapeMenu" class="shape-menu" hidden>
        <button type="button" class="shape-choice" draggable="true" data-tool="shape" data-shape="rect" title="Rectangle" aria-label="Rectangle"><svg class="shape-choice-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16"></rect></svg></button>
        <button type="button" class="shape-choice" draggable="true" data-tool="shape" data-shape="circle" title="Circle" aria-label="Circle"><svg class="shape-choice-icon shape-choice-icon-circle" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle></svg></button>
        <button type="button" class="shape-choice" draggable="true" data-tool="shape" data-shape="triangle" title="Triangle" aria-label="Triangle"><svg class="shape-choice-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 22 21H2Z"></path></svg></button>
        <button type="button" class="shape-choice" draggable="true" data-tool="shape" data-shape="line" title="Line" aria-label="Line"><svg class="shape-choice-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18"></path></svg></button>
        <button type="button" class="shape-choice" draggable="true" data-tool="shape" data-shape="arrow" title="Arrow" aria-label="Arrow"><svg class="shape-choice-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h17M14 5l7 7-7 7"></path></svg></button>
      </div>
    </div>

    <div class="structure-tool">
      <button id="structureMenuBtn" type="button" class="palette-item tool-structure icon-tooltip" title="Structure" aria-label="Structure" data-tooltip="Structure">
        <svg class="structure-palette-icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="2.5" y="8" width="5" height="8"></rect>
          <rect x="9.5" y="8" width="5" height="8"></rect>
          <rect x="16.5" y="8" width="5" height="8"></rect>
          <path d="M5 5h14"></path>
        </svg>
        <span>Structure</span>
      </button>
      <div id="structureMenu" class="structure-menu structure-icon-menu" aria-label="Structure" hidden>
        <button class="icon-tooltip" type="button" draggable="true" data-tool="structure" data-structure-mode="normal" title="Array" aria-label="Array" data-tooltip="Array">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="7" width="6" height="10"></rect><rect x="9" y="7" width="6" height="10"></rect><rect x="16" y="7" width="6" height="10"></rect></svg>
        </button>
        <button class="icon-tooltip" type="button" draggable="true" data-tool="structure" data-structure-mode="matrix" title="2D Array" aria-label="2D Array" data-tooltip="2D Array">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8"></rect><rect x="13" y="3" width="8" height="8"></rect><rect x="3" y="13" width="8" height="8"></rect><rect x="13" y="13" width="8" height="8"></rect></svg>
        </button>
        <button class="icon-tooltip" type="button" draggable="true" data-tool="structure" data-structure-mode="binary_tree" title="Tree" aria-label="Tree" data-tooltip="Tree">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v4M6 14v-3h12v3"></path><circle cx="12" cy="4" r="3"></circle><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="18" r="3"></circle></svg>
        </button>
        <button class="icon-tooltip" type="button" draggable="true" data-tool="structure" data-structure-mode="heap" title="Heap" aria-label="Heap" data-tooltip="Heap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v3M7 13v-3h10v3"></path><rect x="9" y="2" width="6" height="5"></rect><rect x="4" y="13" width="6" height="5"></rect><rect x="14" y="13" width="6" height="5"></rect><path d="M3 21h18"></path></svg>
        </button>
        <button class="icon-tooltip" type="button" draggable="true" data-tool="structure" data-structure-mode="segment_tree" title="Segment Tree" aria-label="Segment Tree" data-tooltip="Segment Tree">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2" width="10" height="5"></rect><rect x="2" y="16" width="8" height="5"></rect><rect x="14" y="16" width="8" height="5"></rect><path d="M12 7v4M6 16v-5h12v5"></path></svg>
        </button>
        <button class="icon-tooltip" type="button" draggable="true" data-tool="structure" data-structure-mode="BIT" title="Binary Indexed Tree" aria-label="Binary Indexed Tree" data-tooltip="Binary Indexed Tree">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="15" width="4" height="6"></rect><rect x="7" y="10" width="6" height="11"></rect><rect x="14" y="3" width="8" height="18"></rect><path d="M4 15l6-5 8-7"></path></svg>
        </button>
        <button class="icon-tooltip" type="button" draggable="true" data-tool="structure" data-structure-mode="stack" title="Stack" aria-label="Stack" data-tooltip="Stack">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="15" width="12" height="5"></rect><rect x="6" y="9" width="12" height="5"></rect><rect x="6" y="3" width="12" height="5"></rect></svg>
        </button>
        <button class="icon-tooltip" type="button" draggable="true" data-tool="structure" data-structure-mode="queue" title="Queue" aria-label="Queue" data-tooltip="Queue">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12h3M20 12h3M2 12l2-2M2 12l2 2M22 12l-2-2M22 12l-2 2"></path><rect x="5" y="7" width="4" height="10"></rect><rect x="10" y="7" width="4" height="10"></rect><rect x="15" y="7" width="4" height="10"></rect></svg>
        </button>
        <button class="icon-tooltip" type="button" draggable="true" data-tool="structure" data-structure-mode="disk" title="Disk" aria-label="Disk" data-tooltip="Disk">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v18M3 21h18"></path><rect x="8" y="5" width="8" height="4"></rect><rect x="6" y="10" width="12" height="4"></rect><rect x="4" y="15" width="16" height="4"></rect></svg>
        </button>
      </div>
    </div>

    <button id="algorithmEditSlideBtn" type="button" class="palette-item algorithm-edit-sidebar-action" hidden>
      <span class="tool-icon">{;}</span>
      <span>編輯演算法動畫</span>
    </button>
    </div>

    <div id="overviewSidebarPanel" class="sidebar-panel overview-sidebar-panel" hidden>
      <button id="overviewAddSlideBtn" type="button" class="palette-item overview-action">
        <span class="tool-icon">+</span>
        <span>新增投影片</span>
      </button>
      <button id="overviewAddAlgorithmSlideBtn" type="button" class="palette-item overview-action overview-algorithm-action">
        <span class="tool-icon">{;}</span>
        <span>新增演算法動畫投影片</span>
      </button>
    </div>

    <div id="latexEditorPanel" class="sidebar-panel widget-editor-panel" hidden>
      <div class="panel-title">
        <strong>LaTeX</strong>
        <button id="exitLatexEditorBtn" type="button" title="退出">×</button>
      </div>
      <label class="field-label" for="latexFontSizeInput">字體大小</label>
      <input id="latexFontSizeInput" type="number" min="12" max="160" value="34" />
      <textarea id="latexEditorInput" spellcheck="false"></textarea>
      <div class="symbol-grid" aria-label="常用符號">
        <button type="button" data-insert="\frac{}{}">\frac</button>
        <button type="button" data-insert="\sqrt{}">\sqrt</button>
        <button type="button" data-insert="\sum_{i=1}^{n}">Σ</button>
        <button type="button" data-insert="\int_{}^{}">∫</button>
        <button type="button" data-insert="\alpha">α</button>
        <button type="button" data-insert="\beta">β</button>
        <button type="button" data-insert="\theta">θ</button>
        <button type="button" data-insert="\pi">π</button>
        <button type="button" data-insert="\leq">≤</button>
        <button type="button" data-insert="\geq">≥</button>
        <button type="button" data-insert="\neq">≠</button>
        <button type="button" data-insert="\rightarrow">→</button>
      </div>
    </div>

    <div id="codeEditorPanel" class="sidebar-panel widget-editor-panel" hidden>
      <div class="panel-title">
        <strong>code</strong>
        <button id="exitCodeEditorBtn" type="button" title="退出">×</button>
      </div>
      <select id="codeLanguageSelect" title="程式語言">
        <option value="cpp">C++</option>
        <option value="c">C</option>
        <option value="python">Python</option>
        <option value="javascript">JavaScript</option>
        <option value="java">Java</option>
        <option value="plaintext">Plain text</option>
      </select>
      <label class="field-label" for="codeFontSizeInput">字體大小</label>
      <input id="codeFontSizeInput" type="number" min="10" max="80" value="21" />
      <label class="field-label" for="codeFocusLinesInput">關注的行數</label>
      <input id="codeFocusLinesInput" type="text" placeholder="例如：1,3-5" />
      <label class="check-field" for="codeShowLineNumbersInput">
        <input id="codeShowLineNumbersInput" type="checkbox" />
        <span>顯示行號</span>
      </label>
      <button id="openCodeEditorBtn" class="code-editor-open-btn" type="button">編輯程式碼</button>
    </div>

    <div id="structureEditorPanel" class="sidebar-panel widget-editor-panel structure-editor-panel" hidden>
      <div class="panel-title">
        <strong>Structure</strong>
        <button id="exitStructureEditorBtn" type="button" title="Close" aria-label="Close">×</button>
      </div>

      <label class="field-label" for="structureModeSelect">結構模式</label>
      <select id="structureModeSelect">
        <option value="normal">Array</option>
        <option value="matrix">2D Array</option>
        <option value="binary_tree">Tree</option>
        <option value="heap">Heap</option>
        <option value="segment_tree">Segment Tree</option>
        <option value="BIT">Binary Indexed Tree</option>
        <option value="disk">Disk</option>
        <option value="stack">Stack</option>
        <option value="queue">Queue</option>
      </select>

      <div id="structureTreeControls" class="structure-tree-controls" hidden>
        <label>
          <span>樹排列方式</span>
          <select id="structureTreeLayoutSelect">
            <option value="compact">自動緊湊</option>
            <option value="levelorder">層序等距</option>
            <option value="binary">完整二元樹</option>
            <option value="inorder">中序排列</option>
            <option value="preorder">前序排列</option>
            <option value="postorder">後序排列</option>
          </select>
        </label>
        <label>
          <span>排列方向</span>
          <select id="structureTreeDirectionSelect">
            <option value="vertical">垂直</option>
            <option value="horizontal">水平</option>
          </select>
        </label>
        <label>
          <span>箭頭顏色</span>
          <button id="structureTreeArrowColorInput" class="structure-color-button" type="button" data-color="#333333" title="選擇箭頭顏色" aria-label="選擇箭頭顏色"><span></span></button>
        </label>
      </div>

      <div class="structure-field-grid">
        <label>
          <span>索引顯示</span>
          <select id="structureIndexModeSelect">
            <option value="0">只顯示元素</option>
            <option value="1">元素＋索引</option>
            <option value="2">只顯示索引</option>
            <option value="3">二進位索引</option>
            <option value="4">補零二進位索引</option>
          </select>
        </label>
        <label>
          <span>每列數量</span>
          <input id="structureItemsPerRowInput" type="number" min="0" max="30" value="0" />
        </label>
        <label>
          <span>格子間距</span>
          <input id="structureGapInput" type="number" min="0" max="40" value="0" />
        </label>
      </div>

      <div id="structureFrameBackgroundControls" class="structure-frame-background-controls">
        <div class="structure-section-title">Array 外框背景</div>
        <label class="structure-background-toggle">
          <input id="structureFrameBackgroundEnabledInput" type="checkbox" checked />
          <span>顯示背景</span>
          <button id="structureFrameBackgroundColorInput" class="structure-color-button" type="button" data-color="#d1e6ac" title="選擇背景顏色" aria-label="選擇背景顏色"><span></span></button>
        </label>
      </div>

      <div class="structure-section-title">元素樣式</div>
      <div class="structure-style-list">
        <label data-structure-style="highlight">
          <span class="structure-style-icon style-icon highlight" role="img" title="Highlight" aria-label="Highlight"></span>
          <input id="structureHighlightIndicesInput" type="text" placeholder="例如 1,3-5" aria-label="Highlight 索引" />
          <button id="structureHighlightColorInput" class="structure-color-button" type="button" data-color="#ef4444" title="選擇 Highlight 顏色" aria-label="選擇 Highlight 顏色"><span></span></button>
        </label>
        <label data-structure-style="focus">
          <span class="structure-style-icon style-icon focus" role="img" title="Focus" aria-label="Focus"></span>
          <input id="structureFocusIndicesInput" type="text" placeholder="索引" aria-label="Focus 索引" />
          <button id="structureFocusColorInput" class="structure-color-button" type="button" data-color="#3b82f6" title="選擇 Focus 顏色" aria-label="選擇 Focus 顏色"><span></span></button>
        </label>
        <label data-structure-style="point">
          <span class="structure-style-icon style-icon point" role="img" title="Point" aria-label="Point"></span>
          <input id="structurePointIndicesInput" type="text" placeholder="索引" aria-label="Point 索引" />
          <button id="structurePointColorInput" class="structure-color-button" type="button" data-color="#f59e0b" title="選擇 Point 顏色" aria-label="選擇 Point 顏色"><span></span></button>
        </label>
        <label data-structure-style="mark">
          <span class="structure-style-icon style-icon mark" role="img" title="Mark" aria-label="Mark"></span>
          <input id="structureMarkIndicesInput" type="text" placeholder="索引" aria-label="Mark 索引" />
          <button id="structureMarkColorInput" class="structure-color-button" type="button" data-color="#8b5cf6" title="選擇 Mark 顏色" aria-label="選擇 Mark 顏色"><span></span></button>
        </label>
        <label data-structure-style="background">
          <span class="structure-style-icon style-icon background" role="img" title="Background" aria-label="Background"></span>
          <input id="structureBackgroundIndicesInput" type="text" placeholder="索引，留空即不套用" aria-label="Background 索引" />
          <button id="structureBackgroundColorInput" class="structure-color-button" type="button" data-color="#10b981" title="選擇 Background 顏色" aria-label="選擇 Background 顏色"><span></span></button>
        </label>
      </div>
      <div class="structure-legacy-fields" hidden>
        <select id="structureIndexBaseSelect"><option value="0">0</option><option value="1">1</option></select>
        <input id="structureCellSizeInput" type="number" value="58" />
        <input id="structureFontSizeInput" type="number" value="18" />
        <input id="structureBaseFillInput" type="color" value="#f8fbfa" />
        <input id="structureBorderColorInput" type="color" value="#344247" />
        <input id="structureTextColorInput" type="color" value="#1f282d" />
        <input id="structureLineColorInput" type="color" value="#66767b" />
      </div>
    </div>

    <div id="animationEditorPanel" class="sidebar-panel animation-editor-panel" hidden>
      <div id="shapeEditorControls" class="shape-editor-controls" hidden>
        <div class="shape-editor-title">Shape</div>
        <div class="shape-editor-grid">
          <button type="button" class="shape-choice" data-shape-choice="rect" title="Rectangle" aria-label="Rectangle"><svg class="shape-choice-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16"></rect></svg></button>
          <button type="button" class="shape-choice" data-shape-choice="circle" title="Circle" aria-label="Circle"><svg class="shape-choice-icon shape-choice-icon-circle" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle></svg></button>
          <button type="button" class="shape-choice" data-shape-choice="triangle" title="Triangle" aria-label="Triangle"><svg class="shape-choice-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 22 21H2Z"></path></svg></button>
          <button type="button" class="shape-choice" data-shape-choice="line" title="Line" aria-label="Line"><svg class="shape-choice-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18"></path></svg></button>
          <button type="button" class="shape-choice" data-shape-choice="arrow" title="Arrow" aria-label="Arrow"><svg class="shape-choice-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h17M14 5l7 7-7 7"></path></svg></button>
        </div>
      </div>
      <div id="layerEditorControls" class="layer-editor-controls">
        <div class="layer-editor-title">圖層順序</div>
        <div class="layer-action-grid">
