<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AlgoShowMaker 個人投影片工作區" />
  <title>AlgoShowMaker</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="home.css?v=4" />
</head>

<body>
  <header class="app-header">
    <a class="brand" href="/" aria-label="AlgoShowMaker 首頁">
      <span class="brand-mark">A</span>
      <span>AlgoShowMaker</span>
    </a>
    <nav class="header-nav" aria-label="主要導覽">
      <a class="nav-link is-active" href="/">投影片</a>
      <a class="nav-link" href="/algorithm.html">演算法動畫</a>
    </nav>
    <div id="accountArea" class="account-area" hidden>
      <span id="accountName" class="account-name"></span>
      <button id="logoutBtn" class="quiet-btn" type="button">登出</button>
    </div>
  </header>

  <main>
    <section id="guestView" class="guest-view">
      <div class="guest-preview" aria-hidden="true">
        <div class="preview-heading">
          <span class="preview-kicker">你的工作區</span>
          <strong>投影片都在同一個地方</strong>
          <p>登入後可以從任何裝置繼續編輯。</p>
        </div>
        <div class="preview-library">
          <article class="sample-deck sample-deck-main">
            <div class="sample-slide">
              <span class="sample-title-line"></span>
              <span class="sample-code-line line-long"></span>
              <span class="sample-code-line"></span>
              <span class="sample-code-line line-short"></span>
              <span class="sample-accent"></span>
            </div>
            <strong>動態規劃教學</strong>
            <span>12 張投影片</span>
          </article>
          <article class="sample-deck">
            <div class="sample-slide sample-slide-alt">
              <span class="sample-node node-one"></span>
              <span class="sample-node node-two"></span>
              <span class="sample-node node-three"></span>
            </div>
            <strong>圖論演算法</strong>
            <span>8 張投影片</span>
          </article>
        </div>
      </div>

      <section class="auth-panel" aria-labelledby="authTitle">
        <div class="auth-heading">
          <span class="eyebrow">個人工作區</span>
          <h1 id="authTitle">登入 AlgoShowMaker</h1>
          <p id="authSubtitle">開啟你的投影片，繼續上次的編輯。</p>
        </div>

        <div id="authTabs" class="auth-tabs" role="tablist" aria-label="登入方式">
          <button id="loginTab" class="auth-tab is-active" type="button" role="tab" aria-selected="true">登入</button>
          <button id="registerTab" class="auth-tab" type="button" role="tab" aria-selected="false">建立帳號</button>
        </div>

        <form id="authForm" class="auth-form">
          <label for="emailInput">Email</label>
          <input id="emailInput" name="email" type="email" autocomplete="email" placeholder="name@example.com" required />

          <div id="passwordField" class="password-field">
            <label for="passwordInput">密碼</label>
            <div class="input-with-action">
              <input id="passwordInput" name="password" type="password" autocomplete="current-password" placeholder="至少 8 個字元" required />
              <button id="togglePasswordBtn" class="input-icon-btn" type="button" aria-label="顯示密碼" title="顯示密碼">顯示</button>
            </div>
          </div>

          <div id="confirmPasswordField" class="password-field" hidden>
            <label for="confirmPasswordInput">確認密碼</label>
            <input id="confirmPasswordInput" name="confirmPassword" type="password" autocomplete="new-password" placeholder="再次輸入密碼" />
          </div>

          <div id="authMessage" class="form-message" role="status" aria-live="polite"></div>
          <button id="authSubmitBtn" class="primary-btn auth-submit" type="submit">登入</button>
        </form>

        <button id="forgotPasswordBtn" class="text-btn" type="button">忘記密碼？</button>
        <button id="backToLoginBtn" class="text-btn" type="button" hidden>返回登入</button>
      </section>
    </section>

    <section id="dashboardView" class="dashboard-view" hidden>
      <aside class="workspace-sidebar">
        <div>
          <span class="sidebar-label">工作區</span>
          <button class="sidebar-item is-active" type="button">
            <span class="sidebar-icon">▤</span>
            我的投影片
          </button>
          <a class="sidebar-item" href="/algorithm.html">
            <span class="sidebar-icon">▶</span>
            演算法動畫
          </a>
        </div>
        <div class="storage-note">
          <span class="status-dot"></span>
          已啟用雲端儲存
        </div>
      </aside>

      <div class="library">
        <div class="library-heading">
          <div>
            <span class="eyebrow">投影片工作區</span>
            <h1>我的投影片</h1>
          </div>
          <button id="createDeckBtn" class="primary-btn create-btn" type="button">
            <span aria-hidden="true">＋</span>
            新增投影片
          </button>
        </div>

        <div class="library-toolbar">
          <label class="search-field" for="searchInput">
            <span aria-hidden="true">⌕</span>
            <input id="searchInput" type="search" placeholder="搜尋投影片" autocomplete="off" />
          </label>
          <span id="deckCount" class="deck-count"></span>
        </div>

        <div id="libraryMessage" class="library-message" role="status" aria-live="polite"></div>
        <div id="deckGrid" class="deck-grid"></div>

        <div id="emptyState" class="empty-state" hidden>
          <div class="empty-preview" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
          <h2>開始製作第一份投影片</h2>
          <p>新增後會自動儲存到你的帳號。</p>
          <button id="emptyCreateBtn" class="primary-btn" type="button">新增投影片</button>
        </div>
      </div>
    </section>
  </main>

  <dialog id="deckDialog" class="deck-dialog">
    <form id="deckDialogForm" method="dialog">
      <div class="dialog-heading">
        <div>
          <span class="eyebrow">投影片設定</span>
          <h2>重新命名</h2>
        </div>
        <button id="closeDeckDialogBtn" class="icon-btn" type="button" aria-label="關閉" title="關閉">×</button>
      </div>
      <label for="deckTitleInput">名稱</label>
      <input id="deckTitleInput" type="text" maxlength="120" required />
      <div id="deckDialogMessage" class="form-message" role="status"></div>
      <div class="dialog-actions">
        <button id="deleteDeckBtn" class="danger-btn" type="button">刪除</button>
        <span class="dialog-spacer"></span>
        <button id="cancelDeckDialogBtn" class="quiet-btn" type="button">取消</button>
        <button class="primary-btn" type="submit">儲存名稱</button>
      </div>
    </form>
  </dialog>

  <script src="/vendor/fabric/fabric.min.js"></script>
  <script src="draw/draw_array_utils.js"></script>
  <script src="draw/draw_block.js"></script>
  <script src="draw/draw_array_outerframe.js"></script>
  <script src="draw/draw_array_hintWidget.js?v=trace-4"></script>
  <script src="draw/draw_array_normal.js?v=focus-2"></script>
  <script src="draw/draw_array_heap.js?v=focus-2"></script>
  <script src="draw/draw_array_segment_tree.js?v=focus-2"></script>
  <script src="draw/draw_array_BIT.js?v=focus-2"></script>
  <script src="draw/draw_array_disk.js?v=focus-2"></script>
  <script src="draw/draw_array_stack.js?v=focus-2"></script>
  <script src="draw/draw_array_queue.js?v=focus-2"></script>
  <script src="slide-structures.js?v=6"></script>
  <script src="deck-thumbnail.js?v=2"></script>
  <script src="home.js?v=4"></script>
</body>

</html>
